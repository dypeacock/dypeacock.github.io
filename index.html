<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dylan Peacock - Computer Science graduate. Vision systems, production infrastructure, and everything in between." />
    <title>Dylan Peacock - Computer Science Graduate</title>

    <!-- Open Graph / Twitter link previews. Image lives in public/ (not src/assets/)
         since only public/ is copied verbatim to dist/ by Vite - a path under src/
         would 404 on the deployed site even though it resolves fine in dev. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dypeacock.github.io/" />
    <meta property="og:title" content="Dylan Peacock - Computer Science Graduate" />
    <meta property="og:description" content="Dylan Peacock - Computer Science graduate. Vision systems, production infrastructure, and everything in between." />
    <meta property="og:image" content="https://dypeacock.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dylan Peacock's portfolio homepage" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dylan Peacock - Computer Science Graduate" />
    <meta name="twitter:description" content="Dylan Peacock - Computer Science graduate. Vision systems, production infrastructure, and everything in between." />
    <meta name="twitter:image" content="https://dypeacock.github.io/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Set theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- GitHub Pages SPA routing: restore the real path after the 404.html redirect trick -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Dylan Peacock",
      "url": "https://dypeacock.github.io",
      "jobTitle": "Computer Science Graduate",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Loughborough University"
      },
      "email": "mailto:dylanpeacock.dev@gmail.com",
      "sameAs": [
        "https://github.com/dypeacock",
        "https://uk.linkedin.com/in/dypeacock"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
