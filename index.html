<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dylan Peacock</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fff;
        color: rgb(53, 53, 53);
        text-align: center;
        padding: 2rem;
      }

      .logo {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 3rem;
      }

      .divider {
        width: 4rem;
        height: 2px;
        background-color: rgb(163, 163, 163);
        margin: 1.5rem auto;
      }

      h1 {
        font-size: 3rem;
        font-weight: 600;
      }

      .subtitle {
        font-size: 1.25rem;
        font-weight: 400;
        color: rgb(85, 85, 85);
        max-width: 32rem;
        line-height: 1.7;
        margin-top: 1rem;
      }

      .btn {
        display: inline-block;
        margin-top: 2.5rem;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 1rem;
        padding: 0.9rem 2rem;
        border-radius: 2rem;
        border: rgb(53, 53, 53) 0.1rem solid;
        background: none;
        color: rgb(53, 53, 53);
        text-decoration: none;
        cursor: pointer;
        transition: all 300ms ease;
      }

      .btn:hover {
        background: rgb(53, 53, 53);
        color: #fff;
      }

      footer {
        position: fixed;
        bottom: 1.5rem;
        font-size: 0.85rem;
        color: rgb(163, 163, 163);
      }
    </style>
  </head>
  <body>
    <div class="logo">Dylan Peacock</div>
    <h1>Under Construction</h1>
    <div class="divider"></div>
    <p class="subtitle">
      This website is currently being redesigned and is temporarily unavailable.
      Thank you for your patience — it will be back soon with a fresh new look.
    </p>
    <a class="btn" href="./archived.html">View archived site</a>
    <footer>&#169; 2025 Dylan Peacock</footer>
  </body>
</html>
